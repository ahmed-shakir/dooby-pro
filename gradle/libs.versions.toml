[versions]
####### ANDROID SDK #######
android-compileSdk = "37"
android-minSdk = "28"
android-targetSdk = "37"
###########################
agp-version = "9.3.1"
ksp-version = "2.3.10"
kotlin-version = "2.4.10"
kotlinx-datetime-version = "0.8.0"
kotlinx-coroutines-version = "1.11.0"
# ANDROID
androidx-core-version = "1.19.0"
androidx-activity-version = "1.13.0"
androidx-lifecycle-version = "2.11.0"
androidx-datastore-version = "1.2.1"
androidx-navigation-version = "2.9.2"
androidx-room-version = "2.8.4"
androidx-sqlite-version = "2.7.0"
androidx-startup-version = "1.2.0"
androidx-splashscreen-version = "1.2.0"
# OTHER
compose-multiplatform-version = "1.11.1"
material3-version = "1.11.0-alpha07"
ktor-version = "3.5.1"
koin-version = "4.2.2"

# TEST
androidx-espresso-version = "3.7.0"
androidx-test-ext-version = "1.7.0"
junit-version = "4.13.2"
compose-test-version = "1.7.0"
compose-multiplatform-test-version = "1.11.1"

[libraries]
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime-version" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-version" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-splashscreen-version" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-version" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle-version" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle-version" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidx-datastore-version" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidx-datastore-version" }
androidx-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation-version" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidx-room-version" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidx-room-version" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidx-sqlite-version" }
androidx-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "androidx-startup-version" }

compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform-version" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-multiplatform-version" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose-multiplatform-version" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose-multiplatform-version" }
compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "compose-multiplatform-version" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose-multiplatform-version" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3-version" }

ktor-client-auth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktor-version" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor-version" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor-version" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor-version" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor-version" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor-version" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor-version" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor-version" }

koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin-version" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin-version" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin-version" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin-version" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin-version" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin-version" }

# TEST
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin-version" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-version" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-ext-version" }
compose-ui-test = { group = "org.jetbrains.compose.ui", name = "ui-test", version.ref = "compose-multiplatform-test-version" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-test-version" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose-test-version" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp-version" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp-version" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform-version" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin-version" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-version" }
androidx-room = { id = "androidx.room", version.ref = "androidx-room-version" }

[bundles]
ktor = [
    "ktor-client-core",
    "ktor-client-auth",
    "ktor-client-logging",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json"
]
